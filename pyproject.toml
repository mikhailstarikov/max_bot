[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "max-bot"
version = "0.1.0"
description = "Портфолио-бот для мессенджера MAX"
requires-python = ">=3.11"

# УДАЛИТЬ: говорим setuptools искать пакеты внутри src
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]